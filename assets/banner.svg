<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>

    <!-- Animated Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #9ca3af;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e0e7ff;
    }
    .feed-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      fill: #cbd5e1;
    }

    /* Ambient pulse animations */
    @keyframes orbPulse1 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.5; }
      50% { transform: scale(1.15) translate(25px, -20px); opacity: 0.8; }
    }
    @keyframes orbPulse2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.2) translate(-30px, 20px); opacity: 0.7; }
    }
    @keyframes feedFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes streamFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { r: 5px; opacity: 0.7; }
      50% { r: 8px; opacity: 1; }
    }

    .orb1 { animation: orbPulse1 9s ease-in-out infinite; transform-origin: 200px 150px; }
    .orb2 { animation: orbPulse2 11s ease-in-out infinite; transform-origin: 1000px 250px; }
    .feed-card1 { animation: feedFloat 6s ease-in-out infinite; }
    .feed-card2 { animation: feedFloat 6s ease-in-out infinite 3s; }
    .pulse-dot { animation: pulseDot 2.5s ease-in-out infinite; }
    .stream-line {
      stroke-dasharray: 8 6;
      animation: streamFlow 2s linear infinite;
    }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g>
    <circle class="orb1" cx="220" cy="140" r="190" fill="url(#glowGrad1)" />
    <circle class="orb2" cx="980" cy="270" r="230" fill="url(#glowGrad2)" />
  </g>

  <!-- Decorative Activity Stream Vectors (Background Ambience) -->
  <g opacity="0.35">
    <path class="stream-line" d="M 50 80 Q 300 20 600 100 T 1150 90" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="stream-line" d="M 80 340 Q 400 390 750 320 T 1150 350" fill="none" stroke="#ec4899" stroke-width="1.8" />
  </g>

  <!-- Dynamic Activity Feed Visual Components on the Right (Foreground Decors) -->
  <g transform="translate(770, 75)">
    <!-- Activity Feed Card 1 -->
    <g class="feed-card1">
      <rect x="0" y="0" width="370" height="105" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
      <circle cx="34" cy="38" r="18" fill="#6366f1" />
      <text x="34" y="43" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="-apple-system, sans-serif">📣</text>
      <text x="66" y="34" class="feed-text" font-weight="700" fill="#f8fafc">Enterprise Product Launch Feed</text>
      <text x="66" y="52" class="feed-text" fill="#94a3b8">Cross-department microblog post updated</text>
      <rect x="66" y="66" width="60" height="18" rx="6" fill="#312e81" />
      <text x="96" y="79" font-size="10" font-weight="bold" fill="#a5b4fc" text-anchor="middle" font-family="-apple-system, sans-serif">#intranet</text>
      <rect x="134" y="66" width="70" height="18" rx="6" fill="#14532d" />
      <text x="169" y="79" font-size="10" font-weight="bold" fill="#86efac" text-anchor="middle" font-family="-apple-system, sans-serif">✓ Sync 2ms</text>
      <circle class="pulse-dot" cx="340" cy="24" r="5" fill="#10b981" />
    </g>

    <!-- Activity Feed Card 2 -->
    <g class="feed-card2" transform="translate(20, 125)">
      <rect x="0" y="0" width="370" height="105" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
      <circle cx="34" cy="38" r="18" fill="#ec4899" />
      <text x="34" y="43" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="-apple-system, sans-serif">⚡</text>
      <text x="66" y="34" class="feed-text" font-weight="700" fill="#f8fafc">Real-time Stream Aggregation</text>
      <text x="66" y="52" class="feed-text" fill="#94a3b8">Self-hosted Redis &amp; Cassandra cluster</text>
      <rect x="66" y="66" width="85" height="18" rx="6" fill="#4c1d95" />
      <text x="108" y="79" font-size="10" font-weight="bold" fill="#c4b5fd" text-anchor="middle" font-family="-apple-system, sans-serif">#open-source</text>
      <rect x="158" y="66" width="65" height="18" rx="6" fill="#701a75" />
      <text x="190" y="79" font-size="10" font-weight="bold" fill="#f472b6" text-anchor="middle" font-family="-apple-system, sans-serif">🔥 Active</text>
      <circle class="pulse-dot" cx="340" cy="24" r="5" fill="#6366f1" />
    </g>
  </g>

  <!-- Foreground Title, Subtitle, and Pills (Guaranteed Top Layer & Sharp Legibility) -->
  <g transform="translate(70, 70)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="250" height="32" rx="16" fill="url(#badgeGrad)" stroke="#4f46e5" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8" class="pulse-dot" />
      <text x="30" y="21" class="pill-text">ENTERPRISE SOCIAL ARCHITECTURE</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 72)">
      <text class="title-text" x="0" y="0">
        Awesome Activity Feeds
      </text>
      <text class="title-text" x="0" y="48" fill="url(#accentGrad)">
        &amp; Enterprise Microblogging
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text class="subtitle-text" x="0" y="162">
      Curated Social Intranets, Employee Timeline Feeds &amp; Self-Hosted Streams
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="67" y="19" class="pill-text" text-anchor="middle" fill="#94a3b8">🌐 Social Intranets</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(145, 0)">
        <rect width="140" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="70" y="19" class="pill-text" text-anchor="middle" fill="#94a3b8">⚡ Activity Streams</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(295, 0)">
        <rect width="130" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="65" y="19" class="pill-text" text-anchor="middle" fill="#94a3b8">🔐 Open Source</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(435, 0)">
        <rect width="140" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="70" y="19" class="pill-text" text-anchor="middle" fill="#94a3b8">💼 SaaS Platforms</text>
      </g>
    </g>
  </g>

  <!-- Clean Bottom Gradient Accent Bar -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#accentGrad)" />
</svg>
